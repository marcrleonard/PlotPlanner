[project]
name = "plotplanner"
version = "0.2.0"
description = "Load, optimize and plot SVGs on an iDraw/AxiDraw pen plotter, locally or over the network."
readme = "README.md"
authors = [{ name = "Marc Leonard", email = "marc.r.leonard@gmail.com" }]
# vpype supports 3.11 to 3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.5",
    "flask>=3.1.3",
    "flask-cors>=6.0",
    "lxml>=6.1",
    "pyserial>=3.5",
    "vpype>=1.15,<2",
]

[project.scripts]
plotplanner = "plotplanner.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotplanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
